name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Dependency vulnerability scan
        run: python -m pip-audit || true

      - name: Lint (pyflakes)
        run: python -m pyflakes bot.py config.py commands functions tools benchmarks

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Dependency check
        run: python -m pip check

      - name: Unit tests (warnings as errors)
        run: python -m pytest -W error::RuntimeWarning -q

      - name: Review agent self-test
        run: python tools/review_agent.py --self-test

      - name: Secret scan
        run: |
          if grep -rnE 'sk_live_[A-Za-z0-9]{24,}|sk_test_[A-Za-z0-9]{24,}|xoxb-[A-Za-z0-9-]+|ghp_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{82,}|AIza[0-9A-Za-z\\-_]{35,}' bot.py config.py commands functions tools benchmarks requirements*.txt .env*; then
            echo "::error::Potential secret detected in committed files"
            exit 1
          fi
          echo "No committed secrets detected"

      # Smoke test only: the pipeline must run end to end. Latency is 0 so
      # this is a correctness check, not a benchmark gate.
      - name: Voice pipeline smoke run
        run: >-
          python benchmarks/voice_pipeline.py
          --label ci --latency 0 --users 4 --toggles 1

  review:
    name: Review agent (diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the agent needs the merge base to build the diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Review the proposed change
        # Fails only on blocking findings (destructive SQL, schema changes,
        # committed secrets, blocking calls in coroutines, unbounded shutdown
        # flush). Warnings are printed but reported as suggestions.
        run: |
          python tools/review_agent.py --base "origin/${{ github.base_ref }}" --head HEAD
