# ============================================================================
# Paradise's Lavalink node configuration (Lavalink v4, Java 17+)
#
# This is the node-side half of Paradise's music system. The bot itself
# connects with the LAVALINK_HOST / LAVALINK_PORT / LAVALINK_PASSWORD /
# LAVALINK_SECURE variables from .env — see ../.env.example.
#
# Run it:            docker compose up -d        (from this directory)
# Verify it started: python verify_node.py       (checks plugins really load)
#
# Plugin notes (details in README.md):
#   * youtube-plugin is pinned to an exact snapshot build on purpose — the
#     requested version, f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3, is the
#     commit https://github.com/lavalink-devs/youtube-source/commit/f45bbb7
#     ("Recover the total length for formats that omit contentLength").
#   * The built-in YouTube source below is DISABLED, as the plugin's README
#     requires — the plugin replaces it and serves ytsearch:/ytmsearch:.
# ============================================================================

server: # REST and WS server
  port: ${LAVALINK_PORT:2333}
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    # YouTube source (lavalink-devs/youtube-source). Snapshot builds are
    # addressed by their full commit hash — this is the documented format
    # for snapshots and the exact version requested for Paradise.
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
      repository: "https://maven.lavalink.dev/snapshots" # official snapshot repo

    # ------------------------------------------------------------------
    # chanom-plugin 1.0.6 — requested, but NOT DECLARED (yet). See README.md.
    #
    # No Maven repository on earth currently hosts a "chanom-plugin"
    # artifact (checked: maven.lavalink.dev, JitPack, Maven Central,
    # GitHub). Lavalink HARD-FAILS at startup when a declared plugin cannot
    # be downloaded, so declaring guessed coordinates would take the whole
    # music node down. The moment the real coordinates exist, add:
    #
    # - dependency: "<group>:chanom-plugin:1.0.6"
    #   repository: "https://…its documented repository…"
    # ------------------------------------------------------------------

  # pluginsDir: "./plugins" # optional, defaults to ./plugins (persisted by docker compose)

  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      # The default YouTube source is deprecated and must stay OFF — the
      # youtube-plugin above replaces it (see its README).
      youtube: false
      bandcamp: true
      soundcloud: true      # also serves Paradise's scsearch: fallback
      twitch: true
      vimeo: true
      http: true            # Paradise's TTS plays clips via direct audio links
      local: false
    filters: # all enabled, defaults from the official example config
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: 6    # picked up by the youtube-plugin automatically
    playerUpdateInterval: 5
    youtubeSearchEnabled: true     # legacy builtin-source toggle (builtin is off above;
                                   # the plugin's plugins.youtube.allowSearch governs)
    soundcloudSearchEnabled: true
    soundcloudFilterOutPreviewTracks: false
    gc-warnings: true
    #ratelimit:
      #ipBlocks: ["1.0.0.0/8", "..."]
      #excludedIps: ["...", "..."]
      #strategy: "RotateOnBan"
      #searchTriggersFail: true
      #retryLimit: -1
    timeouts:
      connectTimeoutMs: 3000
      connectionRequestTimeoutMs: 3000
      socketTimeoutMs: 3000

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    includePayload: true
    maxPayloadLength: 10000
    beforeRequest: false
  logback:
    rollingpolicy:
      max-file-size: 1GB
      max-history: 30

# ----------------------------------------------------------------------------
# Plugin-specific sections. `plugins` sits at the ROOT of the file (this is
# the Lavalink v4 convention, not a mistake).
# ----------------------------------------------------------------------------
plugins:
  youtube:
    enabled: true
    allowSearch: true                # ytsearch: / ytmsearch: (used by /play)
    allowDirectVideoIds: true        # bare video IDs resolve too
    allowDirectPlaylistIds: true
    # Client order is load-bearing: youtube-source walks this list until a
    # client succeeds. MUSIC = ytmsearch: catalog (metadata only), ANDROID_VR
    # works without any credentials, WEB and WEBEMBEDDED cover the rest.
    # See https://github.com/lavalink-devs/youtube-source#clients.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED
    #
    # Optional hardening (both need secrets you provide — leave off to run
    # credential-free with the clients above):
    #oauth:
    #  enabled: true
    #  refreshToken: "…"
    #pot:
    #  token: "…"
    #  visitorData: "…"
