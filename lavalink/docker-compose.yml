# Paradise's Lavalink node.
#
#   LAVALINK_PASSWORD=… docker compose up -d      # start the node
#   python verify_node.py                          # confirm it + plugins are healthy
#
# The image tracks the current Lavalink v4 line. The application.yml next to
# this file declares the youtube-plugin; Lavalink downloads the pinned build
# from maven.lavalink.dev on first start and caches it in ./plugins/.

services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: paradise-lavalink
    restart: unless-stopped
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_PORT: ${LAVALINK_PORT:-2333}
      # Right-size the heap for a small, friends-only server.
      JAVA_TOOL_OPTIONS: -Xmx1G
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
      - ./plugins/:/opt/Lavalink/plugins/
    ports:
      # Bind to localhost by default — expose deliberately if the bot runs
      # on another machine, and never without a real password set.
      - "127.0.0.1:${LAVALINK_PORT:-2333}:${LAVALINK_PORT:-2333}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:${LAVALINK_PORT:-2333}/version >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
